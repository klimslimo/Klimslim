<style>
:root{--bg:#f5f5f2;--paper:#fff;--ink:#202522;--muted:#777f79;--line:#e3e5df;--green:#344b42;--soft:#e8eee9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
header{height:72px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:24px;padding:0 clamp(18px,4vw,58px);background:#fbfbf9f5;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.logo{font-size:19px;font-weight:800;letter-spacing:2px;white-space:nowrap}.logo span{color:#8b9c90}.search{position:relative;flex:1;max-width:600px;margin:auto}.search input{width:100%;height:40px;padding:0 16px 0 40px;border:1px solid transparent;border-radius:24px;background:#f0f1ed}.search input:focus{outline:1px solid #aab9ae;background:white}.search:before{content:"⌕";position:absolute;left:14px;top:6px;font-size:24px;color:var(--muted)}.actions{display:flex;align-items:center;gap:15px;white-space:nowrap}.lang{border:0;background:transparent;color:var(--green);font-size:12px}.cart-open{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:22px;background:#fff}.count{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--green);color:white;font-size:11px}.profile{display:flex;align-items:center;gap:8px;font-size:12px}.avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#e1e6df;color:var(--green);font-weight:bold}
.layout{display:grid;grid-template-columns:225px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 122px)}aside{padding:24px 15px;border-right:1px solid var(--line);background:#f0f2ed}.side-label{margin:0 0 12px 9px;color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase}.category-block{margin-bottom:4px}.category{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:#59625b;text-align:left;font-size:13px}.category:hover,.category.active{background:var(--soft);color:var(--green)}.cat-name{display:flex;align-items:center}.dot{display:inline-block;width:7px;height:7px;margin-right:9px;border:1px solid #9eaaa1;border-radius:50%}.category.active .dot{background:var(--green)}.chevron{color:#8c948e}.sub-list{display:none;padding:2px 0 7px 27px}.sub-list.open{display:grid}.subcat{padding:6px 0;border:0;background:transparent;color:var(--muted);text-align:left;font-size:11px}.subcat:hover,.subcat.active{color:var(--green);font-weight:bold}
.filter-section{padding:16px 9px;border-top:1px solid #dfe3dc}.filter-title{margin:0 0 11px;font-size:10px;font-weight:bold;letter-spacing:1px;text-transform:uppercase}.price-inputs{display:flex;gap:6px}.price-inputs input{width:50%;min-width:0;padding:7px;border:1px solid var(--line);border-radius:5px;background:white;font-size:11px}.range-wrap{position:relative;height:24px;margin-top:8px}.range-wrap input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;appearance:none}.range-wrap input::-webkit-slider-runnable-track{height:4px;background:#dfe4de}.range-wrap input::-moz-range-track{height:4px;background:#dfe4de}.range-wrap input::-webkit-slider-thumb{width:14px;height:14px;margin-top:-5px;border:2px solid white;border-radius:50%;background:var(--green);box-shadow:0 0 0 1px var(--green);pointer-events:auto;appearance:none}.range-wrap input::-moz-range-thumb{width:11px;height:11px;border:2px solid white;border-radius:50%;background:var(--green);box-shadow:0 0 0 1px var(--green);pointer-events:auto}.range-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:9px}.checks{display:grid;gap:8px}.checks label{color:#59625b;font-size:11px}.checks input{accent-color:var(--green)}
main{min-width:0;padding:24px clamp(16px,2.6vw,38px) 45px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:white}.toolbar-left{color:var(--muted);font-size:12px}.sort-wrap{display:flex;align-items:center;gap:10px}.sort-wrap label{font-size:12px}.sort{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{overflow:hidden;min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--paper);transition:.2s}.card:hover{transform:translateY(-3px);border-color:#c7cec6}.photo{position:relative;height:190px;overflow:hidden;background:#eeefeb}.photo img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:9px;left:9px;padding:5px 7px;border-radius:5px;background:#f7f8f4e8;color:#526158;font-size:9px;text-transform:uppercase}.info{padding:11px}.name{overflow:hidden;margin:0 0 5px;font-size:13px;font-weight:500;text-overflow:ellipsis;white-space:nowrap}.meta{margin:0 0 9px;color:var(--muted);font-size:10px}.stars{color:#c69a45;letter-spacing:1px}.rating-line{display:flex;align-items:center;gap:5px;margin-bottom:10px;font-size:10px}.rating-line span:last-child{color:var(--muted)}.bottom{display:flex;align-items:center;justify-content:space-between;gap:5px}.price{font-size:13px;font-weight:bold;white-space:nowrap}.old{margin-left:3px;color:#a3a8a2;font-size:9px;text-decoration:line-through}.add{padding:7px 8px;border:1px solid #d9ded8;border-radius:6px;background:white;color:var(--green);font-size:10px;white-space:nowrap}.add:hover{background:var(--green);color:white}.empty{grid-column:1/-1;padding:45px 15px;text-align:center;color:var(--muted)}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:12px clamp(18px,4vw,58px);border-top:1px solid var(--line);background:#e9ece6;color:#68706a;font-size:11px}
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:#18211c70}.overlay.open{display:flex}.modal{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,.8fr);gap:20px;width:min(900px,100%);max-height:88vh;overflow:auto;padding:20px;border:1px solid #dfe3dc;border-radius:14px;background:#fbfbf9;box-shadow:0 25px 80px #0002}.modal-list{min-width:0}.modal-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:19px;font-weight:500}.close{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:white;font-size:18px}.cart-scroll{max-height:58vh;overflow:auto}.cart-item{display:grid;grid-template-columns:76px minmax(100px,1fr) 85px 25px;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.cart-item img{width:76px;height:70px;border-radius:7px;object-fit:cover}.cart-item h3{margin:0 0 5px;font-size:12px;font-weight:500}.cart-item p{margin:0;color:var(--muted);font-size:10px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:23px;height:23px;border:1px solid var(--line);border-radius:5px;background:white}.qty strong{font-size:12px}.remove{border:0;background:transparent;color:#9a655e;font-size:16px}.summary-card{align-self:center;padding:17px;border:1px solid var(--line);border-radius:10px;background:white}.summary-card h3{margin:0 0 18px;font-size:15px;font-weight:500}.summary-line{display:flex;justify-content:space-between;gap:10px;margin:10px 0;color:#59625b;font-size:12px}.summary-line.total{padding-top:12px;border-top:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:bold}.checkout{width:100%;margin-top:8px;padding:11px;border:0;border-radius:7px;background:var(--green);color:white;font-size:12px}.checkout:disabled{opacity:.45}.cart-empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;right:20px;bottom:20px;z-index:40;padding:12px 16px;border-radius:8px;background:#263d31;color:white;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:1150px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:850px){.layout{grid-template-columns:190px 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.profile span{display:none}}
@media(max-width:620px){header{height:62px;gap:9px;padding:0 12px}.logo{font-size:15px}.actions{gap:6px}.profile,.lang{display:none}.cart-open{padding:7px}.layout{display:block}aside{padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.side-label{display:none}aside nav{display:flex;overflow:auto}aside .category-block{flex:none}.category{padding:8px;font-size:11px}.sub-list{position:absolute;z-index:3;padding:8px 12px;background:white;box-shadow:0 8px 20px #0002}.filter-section{display:inline-block;vertical-align:top;width:49%;padding:12px 8px}.filter-section.origins{width:100%}main{padding:14px 10px 28px}.toolbar{align-items:flex-start;flex-direction:column;padding:10px}.sort-wrap{width:100%;justify-content:space-between}.sort{max-width:65%}.photo{height:145px}.modal{grid-template-columns:1fr;gap:12px;padding:14px}.summary-card{align-self:auto}.cart-item{grid-template-columns:55px 1fr 70px 20px;gap:8px}.cart-item img{width:55px;height:55px}footer{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">FORMA<span> / OBJECTS</span></a>
  <form class="search" action="catalog.html"><input name="q" id="search" type="search" placeholder="Знайти товар…" aria-label="Пошук товарів"></form>
  <div class="actions"><button class="lang" id="lang">UA | EN</button><button class="cart-open" id="openCart">Кошик <span class="count" id="cartCount">0</span></button><div class="profile"><span>John</span><span class="avatar">J</span></div></div>
</header>
<div class="layout">
  <aside>
    <p class="side-label">Категорії</p>
    <nav id="categories"></nav>
    <section class="filter-section">
      <h2 class="filter-title">Ціна, ₴</h2>
      <div class="price-inputs"><input id="minInput" type="number" min="0" placeholder="Мін. ціна"><input id="maxInput" type="number" min="0" placeholder="Макс. ціна"></div>
      <div class="range-wrap"><input id="minRange" type="range" min="0" max="50000" step="100" value="0" aria-label="Мінімальна ціна"><input id="maxRange" type="range" min="0" max="50000" step="100" value="50000" aria-label="Максимальна ціна"></div>
      <div class="range-labels"><span>0 ₴</span><span>50 000 ₴</span></div>
    </section>
    <section class="filter-section origins"><h2 class="filter-title">Країна-виробник</h2><div class="checks" id="origins"></div></section>
  </aside>
  <main>
    <div class="toolbar"><span class="toolbar-left" id="resultCount">Товари</span><div class="sort-wrap"><label for="sort">Сортувати товари</label><select class="sort" id="sort"><option value="popular">За релевантністю</option><option value="price-up">Від дешевих до дорогих</option><option value="price-down">Від дорогих до дешевих</option><option value="rating">За рейтингом</option><option value="reviews">За кількістю відгуків</option></select></div></div>
    <div class="grid" id="productGrid"></div>
  </main>
</div>
<footer><span>© 2026 FORMA / OBJECTS</span><a href="index.html">← На головну</a></footer>
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Кошик">
    <section class="modal-list"><div class="modal-head"><h2>Кошик</h2><button class="close" id="closeCart" aria-label="Закрити">×</button></div><div class="cart-scroll" id="cartItems"></div></section>
    <aside class="summary-card"><h3>Ваше замовлення</h3><div class="summary-line"><span>Товари</span><strong id="subtotal">0 ₴</strong></div><div class="summary-line"><span>Доставка</span><strong id="delivery">0 ₴</strong></div><div class="summary-line total"><span>Сума замовлення</span><strong id="total">0 ₴</strong></div><button class="checkout" id="checkout">Оформити замовлення</button></aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const products=[
{id:1,name:"Навушники Studio",category:"Електроніка",sub:"Аудіо",price:4290,old:5190,tag:"−17%",meta:"Електроніка · Аудіо",rating:4.9,reviews:128,origin:"Японія",image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80"},
{id:2,name:"Портативна колонка",category:"Електроніка",sub:"Аудіо",price:3690,tag:"Хіт",meta:"Електроніка · Аудіо",rating:4.8,reviews:94,origin:"Данія",image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=700&q=80"},
{id:3,name:"Шкіряний рюкзак",category:"Аксесуари",sub:"Сумки",price:5890,old:6490,tag:"Вибір",meta:"Аксесуари · Сумки",rating:4.7,reviews:62,origin:"Україна",image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=700&q=80"},
{id:4,name:"Настільна лампа",category:"Для дому",sub:"Освітлення",price:2490,tag:"Новинка",meta:"Дім · Освітлення",rating:4.6,reviews:41,origin:"Швеція",image:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=700&q=80"},
{id:5,name:"Механічна клавіатура",category:"Електроніка",sub:"Робоче місце",price:6490,old:7990,tag:"−19%",meta:"Електроніка · Робоче місце",rating:4.9,reviews:155,origin:"Тайвань",image:"https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=700&q=80"},
{id:6,name:"Сонцезахисні окуляри",category:"Аксесуари",sub:"Окуляри",price:1790,tag:"Базова річ",meta:"Аксесуари · Окуляри",rating:4.5,reviews:38,origin:"Італія",image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=700&q=80"},
{id:7,name:"Термочашка",category:"Для дому",sub:"Посуд",price:890,old:1090,tag:"−18%",meta:"Дім · Посуд",rating:4.8,reviews:73,origin:"Данія",image:"https://images.unsplash.com/photo-1514228742587-6b1558f04b33?auto=format&fit=crop&w=700&q=80"},
{id:8,name:"Комп’ютерна миша",category:"Електроніка",sub:"Робоче місце",price:2190,tag:"Новинка",meta:"Електроніка · Робоче місце",rating:4.7,reviews:86,origin:"Японія",image:"https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=700&q=80"},
{id:9,name:"Керамічна ваза",category:"Для дому",sub:"Декор",price:1390,tag:"Новинка",meta:"Дім · Декор",rating:4.6,reviews:29,origin:"Україна",image:"https://images.unsplash.com/photo-1578500494198-246f612d3b3d?auto=format&fit=crop&w=700&q=80"},
{id:10,name:"Бездротова зарядка",category:"Електроніка",sub:"Аксесуари",price:1590,tag:"Вибір",meta:"Електроніка · Аксесуари",rating:4.5,reviews:57,origin:"Китай",image:"https://images.unsplash.com/photo-1591290619762-c588cdb7c9d8?auto=format&fit=crop&w=700&q=80"},
{id:11,name:"Сумка через плече",category:"Аксесуари",sub:"Сумки",price:3290,old:3790,tag:"−13%",meta:"Аксесуари · Сумки",rating:4.8,reviews:48,origin:"Італія",image:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=700&q=80"},
{id:12,name:"Настільний органайзер",category:"Для дому",sub:"Робоче місце",price:1190,tag:"Базова річ",meta:"Дім · Робоче місце",rating:4.4,reviews:21,origin:"Україна",image:"https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=700&q=80"}
];
const money=n=>new Intl.NumberFormat("uk-UA").format(n)+" ₴";
const params=new URLSearchParams(location.search);
const cats=["Усі товари","Електроніка","Для дому","Аксесуари"];
const subMap={"Електроніка":["Аудіо","Робоче місце","Аксесуари"],"Для дому":["Освітлення","Посуд","Декор","Робоче місце"],"Аксесуари":["Сумки","Окуляри"]};
const state={category:cats.includes(params.get("category"))?params.get("category"):"Усі товари",sub:"Усі",query:params.get("q")||"",min:0,max:50000,origins:[],sort:"popular",opened:params.get("category")||"Електроніка"};
document.getElementById("search").value=state.query;
function categoryUrl(c){return c==="Усі товари"?"catalog.html":"catalog.html?category="+encodeURIComponent(c)}
function renderCategories(){
 document.getElementById("categories").innerHTML=cats.map(c=>{
  const subs=subMap[c]||[];
  return `<div class="category-block"><button class="category ${state.category===c?"active":""}" data-category="${c}"><span class="cat-name"><span class="dot"></span>${c}</span><span class="chevron">${subs.length?(state.opened===c?"⌃":"⌄"):""}</span></button><div class="sub-list ${state.opened===c?"open":""}">${subs.map(s=>`<button class="subcat ${state.category===c&&state.sub===s?"active":""}" data-sub="${s}" data-parent="${c}">${s}</button>`).join("")}</div></div>`
 }).join("");
}
function renderOrigins(){document.getElementById("origins").innerHTML=[...new Set(products.map(p=>p.origin))].map(o=>`<label><input type="checkbox" value="${o}" ${state.origins.includes(o)?"checked":""}> ${o}</label>`).join("")}
function imageFallback(img){img.onerror=null;img.src="https://placehold.co/600x500/e8e9e4/526158?text=FORMA"}
function card(p){return `<article class="card"><div class="photo"><img src="${p.image}" alt="${p.name}" loading="lazy" onerror="imageFallback(this)"><span class="tag">${p.tag}</span></div><div class="info"><h3 class="name">${p.name}</h3><p class="meta">${p.meta}</p><div class="rating-line"><span class="stars">★★★★★</span><strong>${p.rating}</strong><span>(${p.reviews} відгуків)</span></div><div class="bottom"><span><span class="price">${money(p.price)}</span>${p.old?` <span class="old">${money(p.old)}</span>`:""}</span><button class="add" onclick="addToCart(${p.id})">У кошик</button></div></div></article>`}
function filteredProducts(){
 const q=state.query.toLocaleLowerCase("uk");
 return products.filter(p=>(state.category==="Усі товари"||p.category===state.category)&&(state.sub==="Усі"||p.sub===state.sub)&&(!q||`${p.name} ${p.category} ${p.sub} ${p.meta} ${p.origin}`.toLocaleLowerCase("uk").includes(q))&&p.price>=state.min&&p.price<=state.max&&(!state.origins.length||state.origins.includes(p.origin)))
 .sort((a,b)=>state.sort==="price-up"?a.price-b.price:state.sort==="price-down"?b.price-a.price:state.sort==="rating"?b.rating-a.rating:state.sort==="reviews"?b.reviews-a.reviews:b.reviews-a.reviews);
}
function render(){
 renderCategories();
 const list=filteredProducts();
 document.getElementById("resultCount").textContent=`Знайдено товарів: ${list.length}`;
 document.getElementById("productGrid").innerHTML=list.length?list.map(card).join(""):`<div class="empty">Нічого не знайдено. Спробуйте змінити пошук або фільтри.</div>`;
}
renderOrigins();render();
document.getElementById("categories").addEventListener("click",e=>{
 const b=e.target.closest("[data-category]");
 if(b){const c=b.dataset.category;state.opened=state.opened===c?"":c;state.category=c;state.sub="Усі";render();return}
 const s=e.target.closest("[data-sub]");
 if(s){state.category=s.dataset.parent;state.opened=s.dataset.parent;state.sub=s.dataset.sub;render()}
});
document.getElementById("search").addEventListener("input",e=>{state.query=e.target.value.trim();render()});
document.getElementById("sort").addEventListener("change",e=>{state.sort=e.target.value;render()});
document.getElementById("origins").addEventListener("change",()=>{state.origins=[...document.querySelectorAll("#origins input:checked")].map(x=>x.value);render()});
function syncPrice(){document.getElementById("minRange").value=state.min;document.getElementById("maxRange").value=state.max;document.getElementById("minInput").value=state.min||"";document.getElementById("maxInput").value=state.max===50000?"":state.max}
document.getElementById("minRange").addEventListener("input",e=>{state.min=Math.min(Number(e.target.value),state.max);syncPrice();render()});
document.getElementById("maxRange").addEventListener("input",e=>{state.max=Math.max(Number(e.target.value),state.min);syncPrice();render()});
document.getElementById("minInput").addEventListener("input",e=>{state.min=Math.max(0,Math.min(50000,Number(e.target.value)||0));if(state.min>state.max)state.max=state.min;syncPrice();render()});
document.getElementById("maxInput").addEventListener("input",e=>{state.max=Math.max(0,Math.min(50000,Number(e.target.value)||50000));if(state.max<state.min)state.min=state.max;syncPrice();render()});
function readCart(){try{return JSON.parse(localStorage.getItem("formaCart")||"{}")}catch{return{}}}
let cart=readCart();
function saveCart(){localStorage.setItem("formaCart",JSON.stringify(cart))}
function showToast(text){const el=document.getElementById("toast");el.textContent=text;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2000)}
function addToCart(id){cart[id]=(cart[id]||0)+1;saveCart();renderCart();showToast("Товар додано до кошика")}
function changeQty(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];saveCart();renderCart()}
function removeItem(id){delete cart[id];saveCart();renderCart()}
function renderCart(){
 const entries=Object.entries(cart);
 document.getElementById("cartCount").textContent=entries.reduce((s,[,n])=>s+n,0);
 document.getElementById("cartItems").innerHTML=entries.length?entries.map(([id,n])=>{const p=products.find(x=>x.id===Number(id));return `<article class="cart-item"><img src="${p.image}" alt="${p.name}"><div><h3>${p.name}</h3><p>Артикул: F-${String(p.id).padStart(4,"0")} · ${money(p.price)}</p></div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button><strong>${n}</strong><button onclick="changeQty(${p.id},1)">+</button></div><button class="remove" onclick="removeItem(${p.id})" aria-label="Видалити">×</button></article>`}).join(""):`<div class="cart-empty">Кошик порожній.<br>Додайте товари з каталогу.</div>`;
 const sum=entries.reduce((s,[id,n])=>s+products.find(x=>x.id===Number(id)).price*n,0),ship=sum&&sum<2000?100:0;
 document.getElementById("subtotal").textContent=money(sum);document.getElementById("delivery").textContent=ship?money(ship):sum?"Безкоштовно":"0 ₴";document.getElementById("total").textContent=money(sum+ship);document.getElementById("checkout").disabled=!sum;
}
renderCart();
document.getElementById("openCart").onclick=()=>document.getElementById("overlay").classList.add("open");
document.getElementById("closeCart").onclick=()=>document.getElementById("overlay").classList.remove("open");
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")e.currentTarget.classList.remove("open")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("overlay").classList.remove("open")});
document.getElementById("checkout").onclick=()=>showToast("Демо-режим: оформлення замовлення не налаштоване");
document.getElementById("lang").onclick=()=>showToast("Інтерфейс доступний українською");
</script>
</body>
</html>
