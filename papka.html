<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>квадраты</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; overflow: hidden; background: white; } .group { position: absolute; top: 100px; left: 100%; display: flex; align-items: center; animation: move-left 6s linear infinite; } .square { width: 180px; height: 140px; } .red { background: red; } .blue { background: blue; margin-left: -130px; margin-top: 75px; z-index: 1; } .green { background: green; margin-left: -90px; margin-top: 40px; z-index: 2; } @keyframes move-left { from { transform: translateX(0); } to { transform: translateX(-500px); } } </style> </head> <body> <div class="group"> <div class="square red"></div> <div class="square blue"></div> <div class="square green"></div> </div> </body> </html>
