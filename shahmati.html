<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Практика: Grid, калькулятор и шахматы</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    h1 {
      margin-top: 40px;
    }

    

    /* 1. Калькулятор */
    .calculator {
      width: min(360px, 100%);
      padding: 12px;
      background: #c5c4d8;
    }

    .display {
      display: flex;
      min-height: 65px;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      padding: 10px;
      background: #000;
      color: white;
      font-size: 28px;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 62px;
      gap: 1px;
      background: #111;
    }

    .keys button {
      border: 0;
      background: #555;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .keys button:hover {
      background: #777;
    }

    .keys .clear {
      grid-column: span 2;
      background: #ae3939;
    }

    .keys .zero {
      grid-column: span 2;
    }

    .keys .equals {
      grid-column: 4;
      grid-row: 4 / span 2;
      background: #064b6d;
    }

    /* 2. Шахматная доска */
    .chess {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: min(400px, 100%);
      aspect-ratio: 1;
      border: 8px solid #d9a878;
      box-shadow: 0 4px 12px #999;
    }

    .square {
      display: grid;
      place-items: center;
      font-size: clamp(20px, 6vw, 38px);
    }

    .light { background: #f5f1ec; }
    .dark  { background: #888; }

    @media (max-width: 500px) {
      .layout {
        grid-template-rows: 40px 130px 120px 60px;
      }
    }
  </style>
</head>

<body>
  <h1>1. Калькулятор</h1>

  <section class="calculator">
    <div class="display" id="display">0</div>
    <div class="keys">
      <button class="clear" data-action="clear">AC</button>
      <button data-action="operator" data-value="/">/</button>
      <button data-action="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-action="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-action="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button class="zero" data-value="0">0</button>
      <button data-action="decimal">.</button>
    </div>
  </section>

  <h1>2. Шахматная доска</h1>

  <section class="chess" id="chess"></section>

  <script>
    // Работа калькулятора
    const display = document.querySelector("#display");
    let current = "0";
    let previous = null;
    let operator = null;
    let shouldReset = false;

    function show(value) {
      display.textContent = value;
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const { action, value } = button.dataset;

      if (action === "clear") {
        current = "0";
        previous = null;
        operator = null;
        show(current);
        return;
      }

      if (action === "operator") {
        previous = Number(current);
        operator = value;
        shouldReset = true;
        return;
      }

      if (action === "decimal") {
        if (shouldReset) {
          current = "0";
          shouldReset = false;
        }
        if (!current.includes(".")) current += ".";
        show(current);
        return;
      }

      if (action === "equals") {
        if (operator === null || previous === null) return;

        const a = previous;
        const b = Number(current);
        let result;

        if (operator === "+") result = a + b;
        if (operator === "-") result = a - b;
        if (operator === "*") result = a * b;
        if (operator === "/") result = b === 0 ? "Ошибка" : a / b;

        current = String(result);
        previous = null;
        operator = null;
        shouldReset = true;
        show(current);
        return;
      }

      if (shouldReset) {
        current = value;
        shouldReset = false;
      } else {
        current = current === "0" ? value : current + value;
      }

      show(current);
    });

    // Создание доски и расстановка фигур Unicode
    const chess = document.querySelector("#chess");
    const board = [
      ["♜", "♞", "♝", "♛", "♚", "♝", "♞", "♜"],
      ["♟", "♟", "♟", "♟", "♟", "♟", "♟", "♟"],
      ["", "", "", "", "", "", "", ""],
      ["", "", "", "", "", "", "", ""],
      ["", "", "", "", "", "", "", ""],
      ["", "", "", "", "", "", "", ""],
      ["♙", "♙", "♙", "♙", "♙", "♙", "♙", "♙"],
      ["♖", "♘", "♗", "♕", "♔", "♗", "♘", "♖"]
    ];

    board.forEach((row, rowIndex) => {
      row.forEach((piece, columnIndex) => {
        const square = document.createElement("div");
        square.className =
          "square " + ((rowIndex + columnIndex) % 2 === 0 ? "light" : "dark");
        square.textContent = piece;
        chess.appendChild(square);
      });
    });
  </script>
</body>
</html>
